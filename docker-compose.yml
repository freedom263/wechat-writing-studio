version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wechat-studio-backend
    restart: always
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/writing_studio.db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEFAULT_MODEL=deepseek-chat
    volumes:
      - studio-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wechat-studio-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  studio-data:
    name: wechat_studio_data
